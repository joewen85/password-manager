<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400" role="img" aria-labelledby="title desc">
  <title id="title">Password Manager 产品宣传海报</title>
  <desc id="desc">跨平台密码管理器宣传海报，强调本地加密、多端一致、可控同步和加密备份。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10231f"/>
      <stop offset="0.42" stop-color="#171916"/>
      <stop offset="1" stop-color="#2a2414"/>
    </linearGradient>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.95"/>
      <stop offset="0.52" stop-color="#77a7ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f6c85f" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f4e8"/>
      <stop offset="1" stop-color="#dfebdf"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#26362f"/>
    </linearGradient>
    <pattern id="dotGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#f8f4e8" opacity="0.12"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#050705" flood-opacity="0.42"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#050705" flood-opacity="0.28"/>
    </filter>
    <style>
      .font { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
      .latin { font-family: "Avenir Next", "Inter", "Helvetica Neue", Arial, sans-serif; }
      .smallCaps { font-size: 32px; font-weight: 700; letter-spacing: 4px; }
      .h1 { font-size: 162px; font-weight: 850; letter-spacing: 0; }
      .h2 { font-size: 64px; font-weight: 760; letter-spacing: 0; }
      .body { font-size: 38px; font-weight: 520; letter-spacing: 0; }
      .caption { font-size: 28px; font-weight: 650; letter-spacing: 0; }
      .tiny { font-size: 22px; font-weight: 650; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1600" height="2400" fill="url(#background)"/>
  <rect width="1600" height="2400" fill="url(#dotGrid)" opacity="0.5"/>
  <circle cx="1290" cy="260" r="420" fill="#6ee7b7" opacity="0.18"/>
  <circle cx="118" cy="1830" r="520" fill="#ff7a59" opacity="0.13"/>
  <path d="M1158 101C1325 178 1454 333 1493 509C1533 687 1483 884 1355 1006C1225 1128 1018 1174 872 1084C727 994 643 768 681 570C719 371 835 222 994 133C1053 100 1108 78 1158 101Z" fill="url(#heroGlow)" opacity="0.16"/>

  <g transform="translate(120 132)">
    <rect x="0" y="0" width="366" height="70" rx="35" fill="#f8f4e8" opacity="0.12"/>
    <circle cx="43" cy="35" r="18" fill="#6ee7b7"/>
    <path d="M43 20c-10 0-18 8-18 18v10c0 8 8 15 18 15s18-7 18-15V38c0-10-8-18-18-18Zm-7 18c0-4 3-7 7-7s7 3 7 7v8H36v-8Z" fill="#10231f"/>
    <text x="82" y="45" class="latin smallCaps" fill="#f8f4e8">LOCAL-FIRST VAULT</text>
  </g>

  <g transform="translate(116 284)">
    <text x="0" y="0" class="latin h1" fill="#f8f4e8">Password</text>
    <text x="0" y="166" class="latin h1" fill="#f8f4e8">Manager</text>
    <text x="4" y="264" class="font h2" fill="#6ee7b7">跨平台密码管理器</text>
    <text x="4" y="348" class="font body" fill="#e6eadf">把密码、Token 与密钥收进一个</text>
    <text x="4" y="404" class="font body" fill="#e6eadf">本地加密优先的保险库。</text>
  </g>

  <g transform="translate(120 815)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="525" height="116" rx="34" fill="#f8f4e8" opacity="0.96"/>
    <circle cx="60" cy="58" r="30" fill="#10231f"/>
    <path d="M48 56h24v18H48V56Zm5 0V45c0-11 14-11 14 0v11h-6V45c0-3-2-4-4-4s-4 1-4 4v11Z" fill="#6ee7b7"/>
    <text x="112" y="50" class="font caption" fill="#10231f">AES-256-GCM 加密保险库</text>
    <text x="112" y="84" class="font tiny" fill="#536057">本机加密后再同步，不保存明文字段</text>
  </g>

  <g transform="translate(120 967)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="525" height="116" rx="34" fill="#f6c85f"/>
    <circle cx="60" cy="58" r="30" fill="#10231f"/>
    <path d="M60 37a21 21 0 1 0 0 42a21 21 0 0 0 0-42Zm0 10a11 11 0 1 1 0 22a11 11 0 0 1 0-22Zm0-6v34M43 58h34" stroke="#f6c85f" stroke-width="5" stroke-linecap="round"/>
    <text x="112" y="50" class="font caption" fill="#10231f">TOTP / 生物识别解锁</text>
    <text x="112" y="84" class="font tiny" fill="#3f3720">主密码、二次验证、失败锁定协同防护</text>
  </g>

  <g transform="translate(120 1119)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="525" height="116" rx="34" fill="#77a7ff"/>
    <circle cx="60" cy="58" r="30" fill="#10231f"/>
    <path d="M42 62c11-23 25-23 36 0M42 62c11 20 25 20 36 0M60 37v42M39 58h42" fill="none" stroke="#77a7ff" stroke-width="5" stroke-linecap="round"/>
    <text x="112" y="50" class="font caption" fill="#10231f">WebDAV · NAS · S3 同步</text>
    <text x="112" y="84" class="font tiny" fill="#1d314d">按你的基础设施存放加密后的保险库</text>
  </g>

  <g transform="translate(120 1271)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="525" height="116" rx="34" fill="#ff7a59"/>
    <circle cx="60" cy="58" r="30" fill="#10231f"/>
    <path d="M45 47h30v26H45V47Zm7 0V36h16v11M49 56h22M49 64h16" fill="none" stroke="#ff7a59" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="50" class="font caption" fill="#10231f">加密备份与导入导出</text>
    <text x="112" y="84" class="font tiny" fill="#4e2117">完整快照、单条、分类数据可迁移</text>
  </g>

  <g transform="translate(704 504)" filter="url(#softShadow)">
    <rect x="0" y="0" width="760" height="1080" rx="58" fill="url(#panel)"/>
    <rect x="0" y="0" width="760" height="104" rx="58" fill="#10231f"/>
    <circle cx="64" cy="52" r="13" fill="#ff7a59"/>
    <circle cx="106" cy="52" r="13" fill="#f6c85f"/>
    <circle cx="148" cy="52" r="13" fill="#6ee7b7"/>
    <text x="204" y="63" class="latin caption" fill="#f8f4e8">Vault Dashboard</text>

    <g transform="translate(56 158)">
      <rect width="648" height="156" rx="34" fill="#10231f"/>
      <text x="38" y="56" class="font caption" fill="#6ee7b7">保险库状态</text>
      <text x="38" y="112" class="font body" fill="#f8f4e8">128 个 Secret 已加密</text>
      <rect x="438" y="42" width="154" height="72" rx="28" fill="#6ee7b7"/>
      <text x="470" y="88" class="font tiny" fill="#10231f">已同步</text>
    </g>

    <g transform="translate(56 360)">
      <rect width="198" height="142" rx="30" fill="#d6eadb"/>
      <text x="28" y="52" class="latin tiny" fill="#536057">PBKDF2</text>
      <text x="28" y="96" class="latin caption" fill="#10231f">600000</text>
      <rect x="226" y="0" width="198" height="142" rx="30" fill="#e3dcff"/>
      <text x="254" y="52" class="font tiny" fill="#536057">二次验证</text>
      <text x="254" y="96" class="latin caption" fill="#10231f">TOTP</text>
      <rect x="452" y="0" width="196" height="142" rx="30" fill="#fbe2bd"/>
      <text x="480" y="52" class="font tiny" fill="#536057">备份保留</text>
      <text x="480" y="96" class="font caption" fill="#10231f">最近 5 份</text>
    </g>

    <g transform="translate(56 560)">
      <text x="0" y="0" class="font caption" fill="#10231f">最近条目</text>
      <g transform="translate(0 36)">
        <rect width="648" height="104" rx="28" fill="#ffffff"/>
        <rect x="28" y="26" width="52" height="52" rx="18" fill="#6ee7b7"/>
        <path d="M45 53h20M55 43v20" stroke="#10231f" stroke-width="5" stroke-linecap="round"/>
        <text x="104" y="46" class="font tiny" fill="#10231f">Prod Admin</text>
        <text x="104" y="76" class="latin tiny" fill="#68736b">credential · infra · synced</text>
        <rect x="498" y="34" width="96" height="36" rx="18" fill="#e8f8ef"/>
        <text x="521" y="59" class="latin tiny" fill="#167450">AES</text>
      </g>
      <g transform="translate(0 164)">
        <rect width="648" height="104" rx="28" fill="#ffffff"/>
        <rect x="28" y="26" width="52" height="52" rx="18" fill="#77a7ff"/>
        <path d="M42 64h24M42 52h24M42 40h24" stroke="#10231f" stroke-width="5" stroke-linecap="round"/>
        <text x="104" y="46" class="font tiny" fill="#10231f">Billing API Token</text>
        <text x="104" y="76" class="latin tiny" fill="#68736b">service · token · rotated</text>
        <rect x="498" y="34" width="96" height="36" rx="18" fill="#eaf1ff"/>
        <text x="523" y="59" class="latin tiny" fill="#295da8">S3</text>
      </g>
      <g transform="translate(0 292)">
        <rect width="648" height="104" rx="28" fill="#ffffff"/>
        <rect x="28" y="26" width="52" height="52" rx="18" fill="#f6c85f"/>
        <path d="M43 58h22M54 47l11 11-11 11" fill="none" stroke="#10231f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="104" y="46" class="font tiny" fill="#10231f">NAS WebDAV</text>
        <text x="104" y="76" class="latin tiny" fill="#68736b">sync · backup · private</text>
        <rect x="498" y="34" width="96" height="36" rx="18" fill="#fff3cb"/>
        <text x="515" y="59" class="latin tiny" fill="#8a650e">NAS</text>
      </g>
    </g>
  </g>

  <g transform="translate(1036 1010)" filter="url(#softShadow)">
    <rect x="0" y="0" width="360" height="690" rx="64" fill="url(#phone)"/>
    <rect x="32" y="44" width="296" height="602" rx="42" fill="#f8f4e8"/>
    <rect x="140" y="20" width="80" height="10" rx="5" fill="#4f5c54"/>
    <text x="62" y="116" class="font caption" fill="#10231f">快速解锁</text>
    <circle cx="180" cy="244" r="82" fill="#10231f"/>
    <path d="M145 246h70v54h-70v-54Zm14 0v-31c0-44 42-44 42 0v31h-16v-31c0-20-10-22-19-22s-19 2-19 22v31Z" fill="#6ee7b7"/>
    <rect x="62" y="374" width="236" height="68" rx="28" fill="#10231f"/>
    <text x="109" y="418" class="font tiny" fill="#f8f4e8">使用生物识别</text>
    <rect x="62" y="470" width="236" height="48" rx="24" fill="#e4ecdf"/>
    <text x="93" y="502" class="latin tiny" fill="#536057">••••  ••••  ••••</text>
    <g transform="translate(62 552)">
      <circle cx="23" cy="23" r="23" fill="#6ee7b7"/>
      <circle cx="93" cy="23" r="23" fill="#77a7ff"/>
      <circle cx="163" cy="23" r="23" fill="#f6c85f"/>
      <circle cx="233" cy="23" r="23" fill="#ff7a59"/>
    </g>
  </g>

  <g transform="translate(120 1608)">
    <rect x="0" y="0" width="608" height="3" fill="#f8f4e8" opacity="0.22"/>
    <text x="0" y="94" class="font h2" fill="#f8f4e8">一个保险库</text>
    <text x="0" y="176" class="font h2" fill="#f8f4e8">多端一致使用</text>
    <text x="0" y="260" class="font body" fill="#dbe5d7">Android · HarmonyOS · iOS · macOS</text>
    <text x="0" y="316" class="font body" fill="#dbe5d7">Windows · Linux · Shared Core</text>
  </g>

  <g transform="translate(120 2072)">
    <rect x="0" y="0" width="1360" height="180" rx="46" fill="#f8f4e8" opacity="0.1"/>
    <text x="50" y="70" class="font caption" fill="#f8f4e8">本地优先 · 开源可维护 · 加密同步 · 可迁移备份</text>
    <text x="50" y="124" class="font tiny" fill="#b9c7bc">面向个人开发者、运维人员和小团队的跨平台凭据管理方案</text>
    <g transform="translate(1114 44)">
      <rect x="0" y="0" width="172" height="92" rx="32" fill="#6ee7b7"/>
      <text x="35" y="57" class="latin caption" fill="#10231f">Vault</text>
    </g>
